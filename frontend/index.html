<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AWS Expense Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>

<body>

<div class="background"></div>

<div class="container">

    <!-- ================= HEADER ================= -->

    <header class="glass header">

        <h1>☁️ AWS Expense Tracker</h1>

        <p>Serverless Expense Analytics Dashboard</p>

    </header>

    <!-- ================= STATS ================= -->

    <section class="stats-grid">

        <div class="glass stat-card">

            <h3>💰 Total Expenses</h3>

            <h2 id="totalAmount">₹0</h2>

        </div>

        <div class="glass stat-card">

            <h3>📊 Transactions</h3>

            <h2 id="transactionCount">0</h2>

        </div>

        <div class="glass stat-card">

            <h3>🔥 Highest Expense</h3>

            <h2 id="highestExpense">₹0</h2>

        </div>

        <div class="glass stat-card">

            <h3>📈 Average Expense</h3>

            <h2 id="averageExpense">₹0</h2>

        </div>

    </section>

    <!-- ================= DASHBOARD ================= -->

    <section class="dashboard-grid">

        <!-- LEFT -->

        <div class="glass form-card">
            <h2>Add Expense</h2>
            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
            >
            <div class="select-wrapper">
                <select id="category" aria-label="Category">
                    <option value="">Select Category</option>
                    <option value="Food">🍔 Food</option>
                    <option value="Travel">✈ Travel</option>
                    <option value="Shopping">🛒 Shopping</option>
                    <option value="Bills">⚡ Bills</option>
                    <option value="Health">🏥 Health</option>
                    <option value="Fuel">⛽ Fuel</option>
                    <option value="Entertainment">🎬 Entertainment</option>
                    <option value="Education">📚 Education</option>
                    <option value="Other">📦 Other</option>
                </select>
            </div>
            <input
                type="text"
                id="description"
                placeholder="Enter description"
            >

            <button onclick="addExpense()">

                Add Expense

            </button>

        </div>

        <!-- RIGHT -->

        <div class="glass expenses-card">

            <div class="expenses-header">

                <h2>

                    Recent Expenses

                    <span id="expenseCount">

                        0

                    </span>

                </h2>

                <input

                    id="searchInput"

                    type="text"

                    placeholder="🔍 Search expenses..."

                >

            </div>

            <div id="expensesList">

                <div class="empty-state">

                    No expenses yet.

                </div>

            </div>

        </div>

    </section>

    <!-- ================= CHART ================= -->

    <section class="glass chart-card">

        <h2>Expense Analytics</h2>

        <canvas id="expenseChart"></canvas>

    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="script.js"></script>

</body>

</html>
